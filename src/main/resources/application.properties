spring.application.name=scalable-read-api
server.port=8080

# In-memory H2 database (no installation needed)
spring.datasource.url=jdbc:h2:mem:readdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.h2.console.enabled=true

# Pagination defaults / safety limit
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Ehcache through JCache
spring.cache.type=jcache
spring.cache.jcache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.cache.jcache.config=classpath:ehcache.xml

# Demo data + simulated heavy aggregation (so the cache effect is visible)
app.seed.authors=20
app.seed.posts=2000
app.analytics.simulated-delay-ms=500
